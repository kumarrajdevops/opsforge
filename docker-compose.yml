services:
  opsforge-postgres:
    # Upstream image re-tagged so every image in the stack is named opsforge-<service>.
    build:
      dockerfile_inline: FROM pgvector/pgvector:pg17
    image: opsforge-postgres:${OPSFORGE_TAG:-dev}
    container_name: opsforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsforge}
      POSTGRES_DB: ${POSTGRES_DB:-opsforge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-opsforge}']
      interval: 5s
      timeout: 5s
      retries: 10

  opsforge-redis:
    build:
      dockerfile_inline: FROM redis:7-alpine
    image: opsforge-redis:${OPSFORGE_TAG:-dev}
    container_name: opsforge-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Full containerised stack: docker compose --profile app up --build
  opsforge-api:
    profiles: ['app']
    image: opsforge-api:${OPSFORGE_TAG:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: opsforge-api
    environment:
      API_ENV: ${API_ENV:-development}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_CORS_ORIGINS: '["http://localhost:8080"]'
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsforge}:${POSTGRES_PASSWORD:-opsforge}@opsforge-postgres:5432/${POSTGRES_DB:-opsforge}
      REDIS_URL: redis://opsforge-redis:6379/0
      # nginx in opsforge-web is the one proxy that appends X-Forwarded-For.
      API_TRUSTED_PROXIES: '1'
    ports:
      - '${API_PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      opsforge-postgres:
        condition: service_healthy
      opsforge-redis:
        condition: service_healthy

  opsforge-web:
    profiles: ['app']
    image: opsforge-web:${OPSFORGE_TAG:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: opsforge-web
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      opsforge-api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
