server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://opsforge-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;

    # Security headers for the static app. /api/ responses keep the API's own headers, so they
    # are not set at server level (that would duplicate them). Strict-Transport-Security
    # belongs to the TLS terminator in front of this container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
